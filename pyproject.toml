[project]
name = "batatastream"
version = "0.1.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["data", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["common/tests", "ingest/tests", "ml/tests", "serving/tests"]
addopts = "-ra"
markers = ["spark: needs a local SparkSession (slower)"]
