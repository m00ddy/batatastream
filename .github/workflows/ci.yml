name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pr-checks:
    name: PR title and size
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Conventional commit title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|chore|test|refactor|perf|ci)(\((ingest|ml|serving|common|report|infra)\))?!?: .+'
          if ! [[ "$TITLE" =~ $pattern ]]; then
            echo "::error::PR title '$TITLE' is not a conventional commit, e.g. 'feat(ingest): add JBB loader'"
            exit 1
          fi
      - name: PR size (warning only)
        env:
          ADDED: ${{ github.event.pull_request.additions }}
          DELETED: ${{ github.event.pull_request.deletions }}
        run: |
          total=$((ADDED + DELETED))
          echo "Changed lines: $total"
          if [ "$total" -gt 400 ]; then
            echo "::warning::This PR changes $total lines (limit is about 400). Consider splitting it."
          fi

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff==0.6.9
      - run: ruff check --output-format=github .
      - run: ruff format --check .

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      # Spark 3.5 needs Java 17; the runner's default Java is newer and breaks it.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest
